name: Organiser helpers
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: organiser-helpers
  cancel-in-progress: false
jobs:
  follow-up:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run organiser follow-ups
        env:
          ORGANISER_HELPERS_SECRET: ${{ secrets.ORGANISER_HELPERS_SECRET }}
        run: node scripts/run-organiser-helpers.mjs
